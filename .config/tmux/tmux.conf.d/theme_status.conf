# configuring theme, colours and status bar

# theme
#set -g window-style bg="#232627",fg="#ffffff"
#set -g window-active-style bg="#232627",fg="#ffffff"

# status-bar
set -g status on
set -g status-interval 1

#set -g status-position top
set -g status-style 'bg=#000000,fg=#ffffff'

# left field of status-bar
set -g status-left-length '100'
set -g status-left '[ #S ] '

# window formatting of status-bar
set -g window-status-current-style 'fg=#000000,bg=#ffffff'
set -g window-status-current-format '#I:#W#F '
set -g window-status-style ''
set -g window-status-format '#I:#W#F '

# right field of status-bar
set -g status-right-length '100'
set -g status-right '#{prefix_highlight} | %H:%M:%S #h '
#set -g status-right '#{prefix_highlight} | #{cpu_percentage} - #{ram_percentage} - #{download_speed} - #{upload_speed} | %H:%M:%S #h '
