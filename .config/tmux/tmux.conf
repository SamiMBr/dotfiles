# adding tmux plugins, plugins code is in ~/.tmux/plugins

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
#set -g @plugin 'tmux-plugins/tmux-net-speed'


# genral options
run-shell 'tmux source-file $HOME/.config/tmux/tmux.conf.d/options.conf'

# keybindings file
run-shell 'tmux source-file $HOME/.config/tmux/tmux.conf.d/keybinds.conf'

# theme and status bar
run-shell 'tmux source-file $HOME/.config/tmux/tmux.conf.d/theme_status.conf'

# yazi image preview configs
run-shell 'tmux source-file $HOME/.config/tmux/tmux.conf.d/yazi_image_preview.conf'

# plugin configurations
run-shell 'tmux source-file $HOME/.config/tmux/tmux.conf.d/plugins_config.conf'

# this sould always remain the last instruction in this configuration file

run-shell '~/.config/tmux/plugins/tpm/tpm'
